/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}

.hud-obj{flex:1;text-align:center;font-size:13px;color:var(--o2);font-weight:600;text-shadow:0 1px 2px #000}
.hud-timer{font:700 16px ui-monospace,monospace;background:#0008;padding:3px 8px;border-radius:6px}.hud-timer.over{color:#ff6b5a}
.hbtn{background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:40px;font-weight:700}
.hud-left{position:absolute;left:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;max-width:46vw}
.hud-teams{display:flex;gap:6px}
.teamchip{background:var(--pan);border:2px solid var(--tc);border-radius:10px;padding:6px 12px;min-width:74px;text-align:left;opacity:.8}
.teamchip b{display:block;color:var(--tc);font-size:14px}.teamchip small{color:var(--dim)}
.teamchip.on{background:color-mix(in srgb,var(--tc) 35%,#111);opacity:1;box-shadow:0 0 0 2px #0006}.teamchip.half{opacity:1}
.hud-ports{display:flex;flex-wrap:wrap;gap:4px}
.port{background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:8px;padding:4px 8px 6px;min-width:84px;text-align:left;position:relative}
.port.on{border-color:var(--o);box-shadow:0 0 0 1px var(--o)}.port.dead{opacity:.35;filter:grayscale(1)}.port.stun{animation:blink .4s infinite}.port.fire .pc{color:#ff6b5a}
.port .pc{font:700 10px monospace;color:var(--o2);margin-right:4px}.port .pn{font-size:12px;font-weight:600}
.port .hp{position:absolute;left:8px;right:8px;bottom:3px;height:3px;background:#0008;border-radius:2px;overflow:hidden}.port .hp i{display:block;height:100%;background:#6fdc6f}
@keyframes blink{50%{opacity:.4}}
.hud-right{position:absolute;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px}
.hud-cmds{display:grid;grid-template-columns:repeat(5,58px);gap:5px}
.cmd{background:var(--pan);border:1px solid var(--line);border-radius:10px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .08s}
.cmd:active{transform:scale(.93)}.cmd .ic{font-size:18px;line-height:1}.cmd .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.cmd.on{background:var(--o);color:#111;border-color:var(--o)}.cmd.empty{opacity:.45}
.cmd .cnt{position:absolute;top:2px;right:4px;font-size:10px;font-weight:700;color:var(--o2)}.cmd.on .cnt{color:#111}
.cmd[data-id=go]{color:var(--o)}.cmd.pulse{animation:pulse 0.8s infinite;background:var(--o);color:#111}
@keyframes pulse{50%{box-shadow:0 0 0 5px #ff7a1a55}}
.pausebtn{width:96px;height:113px;border-radius:14px;background:var(--o);color:#111;font:800 17px sans-serif;letter-spacing:.04em;box-shadow:0 3px 10px #0008}
.pausebtn.paused{background:#2dbb5a;color:#fff;animation:pulse 1.2s infinite}
.toasts{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none!important}
.toast{background:#000b;padding:6px 14px;border-radius:20px;font-size:13px;transition:opacity .5s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.bad{color:#ff8a7a}.toast.good{color:#8ff09a}.toast.info{color:var(--o2)}.toast.fade{opacity:0}
.banner{position:absolute;top:44px;left:0;right:0;text-align:center;font:800 12px sans-serif;letter-spacing:.3em;color:#2dbb5a;opacity:0;pointer-events:none!important}.banner.show{opacity:.9}
.cine{position:absolute;inset:0;pointer-events:none!important;opacity:0;transition:opacity .2s}.cine.show{opacity:1}
.cine .bar{position:absolute;left:0;right:0;height:11vh;background:#000}.cine .bar.t{top:0}.cine .bar.b{bottom:0}
.cine-txt{position:absolute;left:5vw;bottom:14vh;font:900 42px sans-serif;letter-spacing:.12em;color:var(--o);text-shadow:0 2px 12px #000}
.cine-skip{position:absolute;right:4vw;bottom:4vh;font-size:12px;color:#aaa;letter-spacing:.2em;text-transform:uppercase}
.modehint{position:absolute;top:84px;left:50%;transform:translateX(-50%);background:var(--o);color:#111;font-weight:700;padding:6px 14px;border-radius:20px;opacity:0;pointer-events:none!important}.modehint.show{opacity:1}
.doormenu{position:absolute;width:290px;background:#181b20f2;border:1px solid var(--o);border-radius:12px;padding:8px;box-shadow:0 8px 30px #000a;z-index:9}
.dm-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}.dm-h small{color:var(--o2);flex:1}.dm-team{font-size:11px;color:var(--dim)}.dm-x{padding:2px 8px;font-size:16px}
.dm-list{display:flex;flex-direction:column;gap:3px}
.dm-opt{text-align:left;background:#ffffff0d;border:1px solid transparent;border-radius:8px;padding:6px 8px}.dm-opt b{display:block;font-size:13px}.dm-opt b i{color:var(--o2);font-style:normal}.dm-opt small{color:var(--dim);font-size:11px}
.dm-opt.on{border-color:var(--o);background:#ff7a1a22}.dm-opt.dis{opacity:.35}.dm-opt.warn small{color:#ff8a7a}
.dm-flash{width:100%;text-align:left;margin:6px 0;padding:7px 8px;border-radius:8px;background:#ffffff0d}.dm-flash.on{color:var(--o2)}.dm-flash i{font-style:normal;color:var(--dim)}
.dm-acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dm-acts button{padding:10px 4px;border-radius:8px;font-weight:800;font-size:13px}
.dm-go{background:var(--o);color:#111}.dm-wait{background:#2a3038;border:1px solid var(--o)!important;color:var(--o2)}.dm-mv{grid-column:span 2;background:#ffffff10;font-weight:600!important}
.pausemenu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;background:#181b20f5;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;z-index:9}.pausemenu h3{margin:0 0 6px;text-align:center}
.pm-row{display:block;width:100%;text-align:left;background:#ffffff0d;border-radius:8px;padding:11px 12px;margin-bottom:5px}.pm-row b{color:var(--o2)}.pm-row.bad{color:#ff8a7a}

/* ---------- Menus ---------- */
#menu{position:fixed;inset:0;z-index:10;overflow:auto;touch-action:pan-y;background:radial-gradient(ellipse at 30% 0%,#14171bcc,#0b0c0ef2)}

.wallet{font-weight:700}.cash{color:#7ee08a}.tstars{color:#ffd23a;margin-left:8px}
.mainmenu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:22px}

.logo{text-align:center}.logo .l1{font:900 clamp(38px,8vw,78px) sans-serif;letter-spacing:.14em;color:#f2ede4;text-shadow:0 4px 30px #000}.logo .l1::first-letter{color:var(--o)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mcard{text-align:left;background:#1d2127;border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}.mcard:hover{border-color:var(--o)}

.mc-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.mc-best,.mc-lock{font-size:12px;color:var(--dim);margin-top:4px}.mcard.locked{opacity:.5}
.diff{font-size:11px;padding:2px 7px;border-radius:10px;background:#ffffff14}.diff.d2{color:#ffb36b}.diff.d3{color:#ff6b5a}
.stars i{font-style:normal;color:#444;font-size:18px}.stars i.on{color:#ffd23a}

.aar-btns{display:flex;justify-content:center;gap:10px}
